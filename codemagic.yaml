workflows:
  ios-workflow:
    name: iOS Workflow NKB-APP
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.nikahblessing.marriagebeauro.nikahBlessing"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Check signing
        script: |
          echo "=== Profiles ==="
          ls ~/Library/MobileDevice/Provisioning\ Profiles
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "--- $p"
            security cms -D -i "$p" | grep -A1 -E "<key>Name</key>|applesignin|<key>application-identifier</key>"
          done
          echo "=== Project ==="
          grep -E "PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_STYLE|CODE_SIGN_ENTITLEMENTS" ios/Runner.xcodeproj/project.pbxproj
          echo "=== Entitlements ==="
          cat ios/Runner/*.entitlements || true
      - name: Get packages
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true