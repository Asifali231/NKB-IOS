workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: com.nikahblessing.marriagebeauro.nikahBlessing
        TEAM_ID: 2LJ8H9R266
        APP_STORE_APPLE_ID: 6831444086
        REVENUECAT_IOS_API_KEY: appl_KOofvEKbcMfFfkWgwMzSpYlCEVd
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          rm -rf "$HOME/.pub-cache/hosted/pub.dev/csc_picker-0.2.7"
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing
        script: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_ISSUER_ID:?Add APP_STORE_CONNECT_ISSUER_ID to the appstore group}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Add APP_STORE_CONNECT_KEY_IDENTIFIER to the appstore group}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Add APP_STORE_CONNECT_PRIVATE_KEY to the appstore group}"
          : "${CERTIFICATE_PRIVATE_KEY:?Add CERTIFICATE_PRIVATE_KEY to the appstore group}"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --issuer-id "@env:APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "@env:APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          security find-identity -v -p codesigning
          PROFILE_DIRS=(
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            "$HOME/Library/MobileDevice/Provisioning Profiles"
          )
          DECODED_PROFILE="$(mktemp)"
          trap 'rm -f "$DECODED_PROFILE"' EXIT
          PROFILE_PATH=""
          PROFILE_NAME=""
          PROFILE_UUID=""
          for PROFILE_DIR in "${PROFILE_DIRS[@]}"; do
            [ -d "$PROFILE_DIR" ] || continue
            for CANDIDATE in "$PROFILE_DIR"/*.mobileprovision; do
              [ -f "$CANDIDATE" ] || continue
              security cms -D -i "$CANDIDATE" > "$DECODED_PROFILE" || continue
              APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PROFILE" 2>/dev/null || true)
              TEAM_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$DECODED_PROFILE" 2>/dev/null || true)
              GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$DECODED_PROFILE" 2>/dev/null || true)
              PROVISIONED_DEVICES=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$DECODED_PROFILE" 2>/dev/null || true)
              case "$APP_IDENTIFIER" in
                *."$BUNDLE_ID") ;;
                *) continue ;;
              esac
              [ "$TEAM_IDENTIFIER" = "$TEAM_ID" ] || continue
              [ "$GET_TASK_ALLOW" = "false" ] || continue
              [ -z "$PROVISIONED_DEVICES" ] || continue
              PROFILE_PATH="$CANDIDATE"
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED_PROFILE")
              PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PROFILE")
              break 2
            done
          done
          if [ -z "$PROFILE_PATH" ]; then
            echo "No App Store provisioning profile found for $BUNDLE_ID and team $TEAM_ID." >&2
            echo "Provisioning profiles installed in the expected directories:" >&2
            for PROFILE_DIR in "${PROFILE_DIRS[@]}"; do
              ls -la "$PROFILE_DIR" >&2 || true
            done
            exit 1
          fi
          echo "Selected App Store profile: $PROFILE_NAME ($PROFILE_UUID)"
          echo "Provisioning profile locations:"
          for PROFILE_DIR in "${PROFILE_DIRS[@]}"; do
            ls -la "$PROFILE_DIR" || true
          done
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --profile "$PROFILE_PATH" \
            --archive-method app-store \
            --export-options-plist "$HOME/export_options.plist"
      - name: Build IPA
        script: |
          set -euo pipefail
          : "${REVENUECAT_IOS_API_KEY:?Add REVENUECAT_IOS_API_KEY to the appstore environment group}"
          if [ ! -f "$HOME/export_options.plist" ]; then
            echo "Export options were not generated by xcode-project use-profiles." >&2
            exit 1
          fi
          LATEST_TESTFLIGHT_BUILD_NUMBER="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          if [[ ! "$LATEST_TESTFLIGHT_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Could not determine the latest TestFlight build number." >&2
            exit 1
          fi
          APP_STORE_BUILD_NUMBER=$((LATEST_TESTFLIGHT_BUILD_NUMBER + 1))
          PUBSPEC_VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | tr -d '\r' | head -n 1)"
          IFS='.' read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<< "$PUBSPEC_VERSION"
          if [[ ! "$VERSION_MAJOR" =~ ^[0-9]+$ ||
                ! "$VERSION_MINOR" =~ ^[0-9]+$ ||
                ! "$VERSION_PATCH" =~ ^[0-9]+$ ]]; then
            echo "pubspec.yaml must contain a numeric major.minor.patch version." >&2
            exit 1
          fi
          APP_BUILD_NAME="$VERSION_MAJOR.$VERSION_MINOR.$((10#$VERSION_PATCH + 1))"
          echo "Using App Store build number: $APP_STORE_BUILD_NUMBER"
          echo "Using iOS build name: $APP_BUILD_NAME"
          flutter build ipa --release \
            --build-name="$APP_BUILD_NAME" \
            --build-number="$APP_STORE_BUILD_NUMBER" \
            --dart-define="REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY" \
            --export-options-plist="$HOME/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
