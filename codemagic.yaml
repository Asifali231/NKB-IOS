workflows:
  ios-workflow:
    name: iOS Workflow NKB-APP
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nikahblessing.marriagebeauro.nikahBlessing
      vars:
        BUNDLE_ID: "com.nikahblessing.marriagebeauro.nikahBlessing"
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          xcode-project use-profiles
      - name: Get packages
        script: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true